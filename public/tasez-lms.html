<!doctype html>
<html lang="en" data-theme="light" class="bg-plane">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TASEZ Training Academy — Learner Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  /* ============================================================
     LAYER 1 — BRAND CONSTANTS (mode-invariant)
     ============================================================ */
  :root {
    --brand-red: #C8102E;
    --brand-red-deep: #9E0B22;
    --brand-gold: #D4A94B;
    --brand-charcoal: #14161A;
    --brand-charcoal-deep: #0D0F12;
  }

  /* ============================================================
     LAYER 2 — SEMANTIC TOKENS · LIGHT
     ============================================================ */
  :root {
    --plane: #EEF0F3;
    --surface: #FFFFFF;
    --surface-2: #F6F7F9;
    --surface-3: #EDEFF2;

    --rail: var(--brand-charcoal);
    --rail-ink: #F4F5F7;
    --rail-ink-2: #AEB4BE;
    --rail-ink-3: #6C7480;
    --rail-line: #262A31;
    --rail-active: rgba(200,16,46,0.16);

    --ink-1: #14161A;
    --ink-2: #464C56;
    --ink-3: #737B87;
    --ink-inverse: #FFFFFF;

    --line: #E3E6EA;
    --line-2: #EDEFF2;
    --line-strong: #CDD2D9;

    --shadow-sm: 0 1px 2px rgba(16,18,22,0.06), 0 1px 1px rgba(16,18,22,0.04);
    --shadow-md: 0 4px 12px rgba(16,18,22,0.08), 0 2px 4px rgba(16,18,22,0.05);
    --shadow-lg: 0 12px 32px rgba(16,18,22,0.12), 0 4px 8px rgba(16,18,22,0.06);
    --shadow-xl: 0 24px 60px rgba(16,18,22,0.18);
    --shadow-accent: 0 8px 24px rgba(200,16,46,0.20);

    --accent: var(--brand-red);
    --accent-hover: var(--brand-red-deep);
    --accent-ink: #FFFFFF;
    --accent-wash: rgba(200,16,46,0.08);
    --accent-wash-2: rgba(200,16,46,0.14);
    --focus-ring: rgba(200,16,46,0.45);

    --radius: 14px;
    --radius-sm: calc(var(--radius) - 8px);
    --radius-md: calc(var(--radius) - 4px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 8px);

    /* status triplets — dot / bg / fg */
    --st-applied-dot: #64748B;   --st-applied-bg: #EEF1F5;   --st-applied-fg: #3F4A5A;
    --st-enrolled-dot: #2563EB;  --st-enrolled-bg: #E8EEFE;  --st-enrolled-fg: #1E45A8;
    --st-placed-dot: #7C3AED;    --st-placed-bg: #F0EAFE;    --st-placed-fg: #5B21B6;
    --st-completed-dot: #15803D; --st-completed-bg: #E6F4EA; --st-completed-fg: #14622F;
    --st-pending-dot: #B45309;   --st-pending-bg: #FBF0DC;   --st-pending-fg: #8A4708;
    --st-flagged-dot: var(--brand-red);    --st-flagged-bg: rgba(200,16,46,0.10);   --st-flagged-fg: #9E0B22;
    --st-suspended-dot: var(--brand-red);  --st-suspended-bg: rgba(200,16,46,0.14); --st-suspended-fg: #7E0A1B;
    --st-certified-dot: var(--brand-gold); --st-certified-bg: #F7EFDA; --st-certified-fg: #8A6A1E;

    /* role identity — bg / fg / ring */
    --role-learner-bg: #E8EEFE;     --role-learner-fg: #1E45A8;     --role-learner-ring: #2563EB;
    --role-facilitator-bg: #E6F4EA; --role-facilitator-fg: #14622F; --role-facilitator-ring: #15803D;
    --role-sponsor-bg: #F7EFDA;     --role-sponsor-fg: #8A6A1E;     --role-sponsor-ring: var(--brand-gold);
    --role-admin-bg: rgba(200,16,46,0.10); --role-admin-fg: #9E0B22; --role-admin-ring: var(--brand-red);

    /* data-viz ordinal ramp gold -> red */
    --viz-1: #D4A94B;
    --viz-2: #D98240;
    --viz-3: #CF4F35;
    --viz-4: #C8102E;
    --viz-grid: #E3E6EA;
    --viz-axis: #9AA1AC;
    --viz-muted: #C6CBD2;
  }

  /* ============================================================
     SEMANTIC TOKENS · DARK  (pure token swap)
     ============================================================ */
  :root[data-theme="dark"] {
    --plane: #0D0F12;
    --surface: #16191F;
    --surface-2: #1C2027;
    --surface-3: #232830;

    --rail: var(--brand-charcoal-deep);
    --rail-ink: #F4F5F7;
    --rail-ink-2: #9BA2AD;
    --rail-ink-3: #676E79;
    --rail-line: #20242B;
    --rail-active: rgba(200,16,46,0.24);

    --ink-1: #F1F3F6;
    --ink-2: #B7BEC9;
    --ink-3: #828A96;
    --ink-inverse: #14161A;

    --line: #262B33;
    --line-2: #20242B;
    --line-strong: #333A44;

    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.6);
    --shadow-xl: 0 24px 60px rgba(0,0,0,0.7);
    --shadow-accent: 0 8px 24px rgba(200,16,46,0.35);

    --accent: #E4324B;
    --accent-hover: #F0435C;
    --accent-ink: #FFFFFF;
    --accent-wash: rgba(228,50,75,0.14);
    --accent-wash-2: rgba(228,50,75,0.22);
    --focus-ring: rgba(228,50,75,0.55);

    --st-applied-dot: #8A94A3;   --st-applied-bg: #262B33;   --st-applied-fg: #C2C9D3;
    --st-enrolled-dot: #5B8DEF;  --st-enrolled-bg: #1B2740;  --st-enrolled-fg: #A9C3F5;
    --st-placed-dot: #A374F0;    --st-placed-bg: #271E3F;    --st-placed-fg: #CBB4F5;
    --st-completed-dot: #3FB463; --st-completed-bg: #14291C; --st-completed-fg: #9BD9AE;
    --st-pending-dot: #E0942E;   --st-pending-bg: #2E2413;   --st-pending-fg: #EAC286;
    --st-flagged-dot: #E4324B;   --st-flagged-bg: rgba(228,50,75,0.16); --st-flagged-fg: #F2909D;
    --st-suspended-dot: #E4324B; --st-suspended-bg: rgba(228,50,75,0.24); --st-suspended-fg: #F6A6B0;
    --st-certified-dot: var(--brand-gold); --st-certified-bg: #2C2413; --st-certified-fg: #E4C583;

    --role-learner-bg: #1B2740;     --role-learner-fg: #A9C3F5;     --role-learner-ring: #5B8DEF;
    --role-facilitator-bg: #14291C; --role-facilitator-fg: #9BD9AE; --role-facilitator-ring: #3FB463;
    --role-sponsor-bg: #2C2413;     --role-sponsor-fg: #E4C583;     --role-sponsor-ring: var(--brand-gold);
    --role-admin-bg: rgba(228,50,75,0.16); --role-admin-fg: #F2909D; --role-admin-ring: #E4324B;

    --viz-1: #E4C583;
    --viz-2: #E0975A;
    --viz-3: #DB6A52;
    --viz-4: #E4324B;
    --viz-grid: #262B33;
    --viz-axis: #5B636E;
    --viz-muted: #3A4049;
  }

  /* ============================================================
     THEME NAMESPACE — utilities read tokens
     ============================================================ */
  @theme inline {
    --color-plane: var(--plane);
    --color-surface: var(--surface);
    --color-surface-2: var(--surface-2);
    --color-surface-3: var(--surface-3);

    --color-rail: var(--rail);
    --color-rail-ink: var(--rail-ink);
    --color-rail-ink-2: var(--rail-ink-2);
    --color-rail-ink-3: var(--rail-ink-3);
    --color-rail-line: var(--rail-line);

    --color-ink-1: var(--ink-1);
    --color-ink-2: var(--ink-2);
    --color-ink-3: var(--ink-3);
    --color-ink-inverse: var(--ink-inverse);

    --color-line: var(--line);
    --color-line-2: var(--line-2);
    --color-line-strong: var(--line-strong);

    --color-accent: var(--accent);
    --color-accent-hover: var(--accent-hover);
    --color-accent-ink: var(--accent-ink);
    --color-accent-wash: var(--accent-wash);
    --color-accent-wash-2: var(--accent-wash-2);

    --color-gold: var(--brand-gold);

    --radius-token: var(--radius);

    --font-display: "Archivo", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-sans: "Inter", ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ============================================================
     LAYER: BASE
     ============================================================ */
  @layer base {
    * { border-color: var(--line); }
    html { background: var(--plane); -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-sans);
      color: var(--ink-1);
      background: var(--plane);
      font-feature-settings: "cv02","cv03","cv04","cv11";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    h1,h2,h3 { font-family: var(--font-display); letter-spacing: -0.01em; }
    ::selection { background: var(--accent-wash-2); color: var(--ink-1); }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
      box-shadow: 0 0 0 4px var(--focus-ring);
    }
    input:focus-visible { box-shadow: 0 0 0 4px var(--focus-ring); }
  }

  /* ============================================================
     LAYER: COMPONENTS  (tokens only)
     ============================================================ */
  @layer components {
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .card-flush {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .num { font-variant-numeric: tabular-nums; }

    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.2rem 0.6rem; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; line-height: 1.2;
      white-space: nowrap;
    }
    .badge::before {
      content: ""; width: 0.5rem; height: 0.5rem; border-radius: 999px;
      background: currentColor; flex: none;
    }
    .badge-applied   { background: var(--st-applied-bg);   color: var(--st-applied-fg); }
    .badge-enrolled  { background: var(--st-enrolled-bg);  color: var(--st-enrolled-fg); }
    .badge-placed    { background: var(--st-placed-bg);    color: var(--st-placed-fg); }
    .badge-completed { background: var(--st-completed-bg); color: var(--st-completed-fg); }
    .badge-certified { background: var(--st-certified-bg); color: var(--st-certified-fg); }
    .badge-pending   { background: var(--st-pending-bg);   color: var(--st-pending-fg); }
    .badge-flagged   { background: var(--st-flagged-bg);   color: var(--st-flagged-fg); }
    .badge-suspended { background: var(--st-suspended-bg); color: var(--st-suspended-fg); }

    .btn-primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--accent); color: var(--accent-ink);
      font-weight: 600; font-size: 0.875rem;
      padding: 0.6rem 1.1rem; border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); transition: background .18s ease, box-shadow .18s ease, transform .18s ease;
      cursor: pointer; border: 1px solid transparent;
    }
    .btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-accent); }
    .btn-primary:active { transform: translateY(1px); }

    .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: var(--surface); color: var(--ink-2);
      font-weight: 600; font-size: 0.875rem;
      padding: 0.55rem 1rem; border-radius: var(--radius-md);
      border: 1px solid var(--line-strong); cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--ink-1); border-color: var(--line-strong); }

    .rail-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem; border-radius: var(--radius-md);
      color: var(--rail-ink-2); font-size: 0.875rem; font-weight: 500;
      cursor: pointer; position: relative; width: 100%; text-align: left;
      transition: background .16s ease, color .16s ease;
      border: 1px solid transparent;
    }
    .rail-item:hover { background: rgba(255,255,255,0.04); color: var(--rail-ink); }
    .rail-item[aria-current="true"] {
      background: var(--rail-active); color: var(--rail-ink);
    }
    .rail-item[aria-current="true"]::before {
      content: ""; position: absolute; left: -0.5rem; top: 50%; transform: translateY(-50%);
      width: 3px; height: 1.35rem; border-radius: 999px; background: var(--brand-red);
    }

    .stat {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .stat-fig { font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums; }

    .fi-scroll { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .fi-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .fi-scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
    .fi-scroll::-webkit-scrollbar-track { background: transparent; }

    .fi-skeleton {
      position: relative; overflow: hidden;
      background: var(--surface-3); border-radius: var(--radius-sm);
    }
    .fi-skeleton::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, var(--surface-2), transparent);
      transform: translateX(-100%); animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(100%); } }

    .timeline-node {
      width: 1.5rem; height: 1.5rem; border-radius: 999px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink-3);
    }
    .timeline-node.done { border-color: var(--brand-gold); background: var(--st-certified-bg); color: var(--st-certified-fg); }
    .timeline-node.current { border-color: var(--accent); color: var(--accent); }
    .timeline-node.current::after {
      content: ""; position: absolute; width: 1.5rem; height: 1.5rem; border-radius: 999px;
      border: 2px solid var(--accent); animation: nodepulse 2s ease-out infinite;
    }
  }

  /* ============================================================
     LAYER: UTILITIES
     ============================================================ */
  @layer utilities {
    .type-display-1 { font-size: 1.75rem; line-height: 1.15; font-weight: 800; }
    .type-display-2 { font-size: 1.35rem; line-height: 1.2; font-weight: 700; }
    .type-h { font-size: 1.05rem; line-height: 1.3; font-weight: 700; }
    .type-body { font-size: 0.9375rem; line-height: 1.55; }
    .type-data { font-size: 0.8125rem; line-height: 1.45; }
    .type-micro { font-size: 0.75rem; line-height: 1.4; }
    .tnum { font-variant-numeric: tabular-nums; }
    .dot-pulse { position: relative; }
    .dot-pulse::after {
      content:""; position:absolute; inset:0; border-radius:999px;
      background: var(--brand-red); animation: dotpulse 2s ease-out infinite;
    }
  }

  @keyframes dotpulse {
    0% { transform: scale(1); opacity: .7; }
    70% { transform: scale(2.6); opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes nodepulse {
    0% { transform: scale(1); opacity: .6; }
    70% { transform: scale(1.7); opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes railIn { from { transform: translateX(-16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes fadeUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .anim-rail-in { animation: railIn .24s ease-out both; }
  .anim-fade-up { animation: fadeUp .3s ease-out both; }

  /* ============================================================
     PRINT — force light tokens, unlock overflow, hide chrome
     ============================================================ */
  @media print {
    :root, :root[data-theme="dark"] {
      --plane:#fff; --surface:#fff; --surface-2:#fff; --surface-3:#f4f4f4;
      --ink-1:#111; --ink-2:#333; --ink-3:#555; --line:#ccc; --line-strong:#aaa;
      --shadow-sm:none; --shadow-md:none; --shadow-lg:none; --shadow-xl:none; --shadow-accent:none;
    }
    .no-print { display: none !important; }
    body { background:#fff !important; }
    .print-region { position: static !important; overflow: visible !important; height: auto !important; max-height: none !important; inset: auto !important; }
    .card, .card-flush { box-shadow: none !important; border:1px solid #ccc !important; break-inside: avoid; }
    .fi-scroll { overflow: visible !important; }
    main { padding: 0 !important; }
    @page { size: A4; margin: 16mm; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<!-- =========================================================
     SSO LOGIN SCREEN
     ========================================================= -->
<div id="login" class="fixed inset-0 z-50 flex items-center justify-center px-5" style="background: var(--brand-charcoal-deep);">
  <div class="absolute inset-0 opacity-[0.5] pointer-events-none"
       style="background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 22px), radial-gradient(circle at 20% 15%, rgba(200,16,46,0.14), transparent 45%);"></div>
  <div class="relative w-full max-w-[420px]">
    <div class="flex items-center gap-3 mb-8">
      <span class="inline-block w-4 h-4 rounded-[3px]" style="background: var(--brand-gold);"></span>
      <span class="type-display-1 tracking-tight" style="color:#fff; font-family: var(--font-display); font-weight:800;">TASEZ</span>
      <span class="type-micro" style="color: var(--rail-ink-2);">Training Academy</span>
    </div>
    <div class="rounded-[18px] p-7" style="background: var(--brand-charcoal); border:1px solid var(--rail-line); box-shadow: var(--shadow-xl);">
      <h1 class="type-display-2 mb-1" style="color:#fff;">Sign in</h1>
      <p class="type-micro mb-6" style="color: var(--rail-ink-2);">Single Sign-On — one identity across all 13 modules</p>
      <form id="loginForm" class="flex flex-col gap-4">
        <label class="flex flex-col gap-1.5">
          <span class="type-micro font-semibold" style="color: var(--rail-ink-2);">Work email</span>
          <input type="email" value="m.malebo@tasez.co.za" autocomplete="username"
            class="num rounded-[10px] px-3.5 py-2.5 text-[0.9rem]"
            style="background: var(--brand-charcoal-deep); border:1px solid var(--rail-line); color:#fff;" />
        </label>
        <label class="flex flex-col gap-1.5">
          <span class="type-micro font-semibold" style="color: var(--rail-ink-2);">Password</span>
          <input type="password" value="demo-access-2026" autocomplete="current-password"
            class="rounded-[10px] px-3.5 py-2.5 text-[0.9rem]"
            style="background: var(--brand-charcoal-deep); border:1px solid var(--rail-line); color:#fff;" />
        </label>
        <button id="loginBtn" type="submit" class="btn-primary mt-2 w-full py-2.5">
          <span id="loginBtnLabel">Sign in</span>
          <svg id="loginSpinner" class="hidden animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9" opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>
        </button>
      </form>
      <p class="type-micro mt-5 pt-4" style="color: var(--rail-ink-3); border-top:1px solid var(--rail-line);">
        POPIA-compliant · Hosted in South Africa · Protected by TASEZ ICT
      </p>
    </div>
  </div>
</div>

<!-- =========================================================
     APP SHELL
     ========================================================= -->
<div id="app" class="hidden min-h-screen">
  <!-- mobile drawer backdrop -->
  <div id="railBackdrop" class="no-print hidden fixed inset-0 z-30 bg-black/50 lg:hidden"></div>

  <!-- LEFT RAIL -->
  <aside id="rail" class="no-print fixed z-40 top-0 left-0 h-screen w-[264px] flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200"
    style="background: var(--rail); border-right:1px solid var(--rail-line);">
    <div class="flex items-center gap-2.5 px-5 h-16 flex-none" style="border-bottom:1px solid var(--rail-line);">
      <span class="inline-block w-3.5 h-3.5 rounded-[3px]" style="background: var(--brand-gold);"></span>
      <span data-railfull class="font-display font-extrabold text-[1.05rem]" style="color:#fff;">TASEZ</span>
      <span data-railfull class="type-micro" style="color: var(--rail-ink-3);">Academy</span>
    </div>
    <nav id="railNav" class="flex-1 overflow-y-auto fi-scroll px-3 py-4 flex flex-col gap-4"></nav>
    <div class="px-3 py-3 flex-none" style="border-top:1px solid var(--rail-line);">
      <button id="railCollapse" class="rail-item" aria-label="Collapse navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span data-railfull>Collapse</span>
      </button>
    </div>
  </aside>

  <!-- MAIN COLUMN -->

function renderCostChart(){
  const c = DATA.costCohort;
  const ramp = ["--viz-1","--viz-2","--viz-3","--viz-4","--viz-muted"];
  const W=640, H=280, padL=54, padB=32, padT=10, padR=10;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const totals = c.cohorts.map(co => c.order.reduce((s,k)=>s+co.seg[k],0));
  const maxV = Math.max(...totals)*1.05;
  const bw = plotW/c.cohorts.length*0.52;
  const gy = 5;
  let grid="";
  for(let i=0;i<=gy;i++){
    const val = maxV/gy*i;
    const y = padT+plotH-(val/maxV)*plotH;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--viz-grid)" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--viz-axis)" font-family="Inter">R ${(val/1000000).toFixed(1)}M</text>`;
  }
  let bars="";
  c.cohorts.forEach((co,ci)=>{
    const cx = padL + plotW/c.cohorts.length*(ci+0.5);
    let acc=0;
    const breakdown = c.order.map(k=>`${k} ${rand(co.seg[k])}`).join(" · ");
    c.order.forEach((k,ki)=>{
      const val=co.seg[k];
      const h=(val/maxV)*plotH;
      const y=padT+plotH-((acc+val)/maxV)*plotH;
      acc+=val;
      const round = ki===c.order.length-1 ? 'rx="3"' : '';
      bars += `<rect class="cost-bar" x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(h,0.5)}" ${round}
        fill="var(${ramp[ki]})" data-tip="${esc(co.name)} — ${esc(k)}: ${rand(val)}"><title>${esc(co.name)} · ${esc(breakdown)} · Total ${rand(totals[ci])}</title></rect>`;
    });
    bars += `<text x="${cx}" y="${H-padB+18}" text-anchor="middle" font-size="10" fill="var(--viz-axis)" font-family="Inter">${esc(co.name)}</text>`;
  });
  return `
  <div class="w-full overflow-x-auto fi-scroll">
    <svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[520px]" role="img" aria-label="${esc(c.title)}">
      ${grid}
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="var(--viz-axis)" stroke-width="1"/>
      <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--viz-axis)" stroke-width="1"/>
      ${bars}
    </svg>
  </div>`;
}

/* =========================================================
   COUNT-UP (dashboard, first load only)
   ========================================================= */
function runCountUps(){
  if(prefersReduced()){ state.countUpDone=true; return; }
  $$("[data-count]").forEach(el=>{
    const target = parseFloat(el.dataset.count);
    const dec = parseInt(el.dataset.decimals||"0",10);
    const pre = el.dataset.prefix||"", suf = el.dataset.suffix||"";
    const dur = 600, start = performance.now();
    function frame(now){
      const t = Math.min((now-start)/dur, 1);
      const eased = 1-Math.pow(1-t,3);
      const val = target*eased;
      el.textContent = pre + (dec>0 ? val.toFixed(dec) : Math.round(val).toLocaleString("en-ZA")) + suf;
      if(t<1) requestAnimationFrame(frame);
      else el.textContent = pre + (dec>0 ? target.toFixed(dec) : Math.round(target).toLocaleString("en-ZA")) + suf;
    }
    requestAnimationFrame(frame);
  });
  state.countUpDone = true;
}
function wireDashboard(){
  if(!state.countUpDone) runCountUps();
  else $$("[data-count]").forEach(el=>{
    const target=parseFloat(el.dataset.count), dec=parseInt(el.dataset.decimals||"0",10);
    el.textContent=(el.dataset.prefix||"")+(dec>0?target.toFixed(dec):Math.round(target).toLocaleString("en-ZA"))+(el.dataset.suffix||"");
  });
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
document.addEventListener("click", (e)=>{
  const t = e.target;

  const nav = t.closest("[data-nav]");
  if(nav){ if(nav.hasAttribute("data-modal-close")) closeModal(); if(t.closest("#drawer")) closeDrawer(); showScreen(nav.dataset.nav); return; }

  const learner = t.closest("[data-learner]");
  if(learner){ SCREENS.learnerDetail && showScreen("learnerDetail"); return; }

  const filter = t.closest("[data-filter]");
  if(filter){ state.learnerFilter = filter.dataset.filter; $("#learnerTableWrap").innerHTML = renderLearnerTable(); renderRailNoop(); refreshFilterChips(); return; }

  const suspend = t.closest("[data-suspend]");
  if(suspend){
    const id = suspend.dataset.suspend;
    state.anomaliesActioned[id] = "Suspended by M. Malebo · 17 Aug 2026 10:52 · SAST";
    $("#anomalyPanel").innerHTML = renderAnomalyPanel();
    // if all resolved, clear the bell dot
    if(DATA.anomalies.every(a=>state.anomaliesActioned[a.id])) $("#bellDot").classList.add("hidden");
    return;
  }

  const signoff = t.closest("[data-signoff]");
  if(signoff){ state.logSignedOff[signoff.dataset.signoff]=true; showScreen("hosts"); return; }

  const report = t.closest("[data-report]");
  if(report){ openFunderReport(); return; }

  const cert = t.closest("[data-cert]");
  if(cert){ openCertificate(); return; }

  if(t.closest("[data-modal-close]")){ closeModal(); return; }

  if(t.id==="themeToggle" || t.closest("#themeToggle")){ toggleTheme(); return; }
  if(t.id==="railToggle" || t.closest("#railToggle")){ openRail(); return; }
  if(t.id==="railCollapse" || t.closest("#railCollapse")){ toggleCollapse(); return; }
  if(t.id==="bellBtn" || t.closest("#bellBtn")){ openDrawer(); return; }
  if(t.id==="railBackdrop"){ closeRail(); return; }
  if(t.id==="drawerBackdrop" || t.id==="drawerClose" || t.closest("#drawerClose")){ closeDrawer(); return; }
  if(t.id==="modalBackdrop"){ closeModal(); return; }
});
